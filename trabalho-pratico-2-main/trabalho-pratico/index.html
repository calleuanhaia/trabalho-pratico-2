<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header align="center">
        <h1>Bem-Vindo(a) ao Game</h1>
    </header>
    <div class="tela-jogo">
        <div class="menu-interface">
            <label id="score-txt" class="score-txt">SCORE: 0</label>
            <label class="timer-txt">TIMER: 100</label>
            <button id="btn-iniciar" class="btn-iniciar">INICIAR</button>
            <div id="star" class="star"></div>
        </div>
        <div class="char-interface">
            <div id="char-img" class="char-imgp"></div>
            <p id="txt-name" class="txt-name"></p>
            <input id="name-input" class="name-input" placeholder="Digite o nome do seu Mario">
        </div>
        <div class="itens-interface">
            <div class="iten-div">
                <div id="cogumelo" class="cogumelo"></div>
            </div>
            <div class="iten-div">
                <div id="flordefogo" class="flordefogo"></div>
            </div>
            <div class="iten-div">
                <div id="penacapa" class="penacapa"></div>
            </div>
            <div class="iten-div">
                <div id="ovoyoshi" class="ovoyoshi"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
